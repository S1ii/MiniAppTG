server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gossipbot.social;

    # Логирование
    access_log /var/log/nginx/gossipbot.access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/gossipbot.error.log warn;

    # Обработка ошибок
    error_page 502 /502.html;
    location = /502.html {
        root /var/www/html;
        internal;
    }

    # Увеличиваем размер буфера для больших заголовков
    large_client_header_buffers 4 32k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
        send_timeout 60;

        # Буферизация
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Таймауты для WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Буферизация для WebSocket
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Дополнительные настройки для SSL (добавить после получения сертификата)
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/gossipbot.social/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gossipbot.social/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
} 